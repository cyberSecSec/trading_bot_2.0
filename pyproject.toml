[tool.poetry]
name = "exchange_api"
version = "0.1.0"
description = "Компонент системы VANTA, обеспечивающий унифицированный доступ к API криптовалютных бирж"
authors = ["VANTA Team <info@vanta.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "exchange_api" }, { include = "models" }]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
pydantic = "^1.9.0"
loguru = "^0.6.0"
python-dotenv = "^0.20.0"
aiohttp = "^3.8.0"
websockets = "^10.3"
backoff = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.18.0"
pytest-cov = "^3.0.0"
black = "^22.3.0"
isort = "^5.10.0"
mypy = "^0.950"
types-requests = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 